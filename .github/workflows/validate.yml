name: Validate sample
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            dab-poc/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix dab-poc/ui && npm run build --prefix dab-poc/ui
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Package DAB and check SAMI telemetry configuration
        run: |
          dotnet msbuild dab-poc/DabBackend.csproj -target:PackageDab -property:DabOutput="$RUNNER_TEMP/dab-artifact"
          DAB_RUNTIME="$(dirname "$(find "$RUNNER_TEMP/dab-artifact/.store" -name Microsoft.DataApiBuilder.deps.json)")"
          dotnet build test/dab-telemetry/DabTelemetryTests.csproj --configuration Release --output "$DAB_RUNTIME" -property:DabToolDirectory="$DAB_RUNTIME"
          dotnet exec --depsfile "$DAB_RUNTIME/Microsoft.DataApiBuilder.deps.json" --runtimeconfig "$DAB_RUNTIME/Microsoft.DataApiBuilder.runtimeconfig.json" "$DAB_RUNTIME/DabTelemetryTests.dll"
      - run: dotnet run --project test/dab-host/DabHostTests.csproj --configuration Release
      - run: DESTINATION_DIR="$RUNNER_TEMP/shopstream-artifact" npm run package
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: |
          az bicep build --file infra/app.bicep --stdout |
            jq -e 'any(.resources[]; .type == "Microsoft.Web/builderApps") and all(.resources[] | select(.type == "Microsoft.Web/builderApps") | .properties.scaling.components[]; .minReplicas == 0)' > /dev/null
